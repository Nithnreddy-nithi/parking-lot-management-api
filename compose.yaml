services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_lot}
      POSTGRES_USER: ${POSTGRES_USER:-parking_lot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_lot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-parking_lot}
      POSTGRES_USER: ${POSTGRES_USER:-parking_lot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_lot}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-SIMULATED}
      SIMULATED_PAYMENT_SCENARIO: ${SIMULATED_PAYMENT_SCENARIO:-SUCCESS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:

