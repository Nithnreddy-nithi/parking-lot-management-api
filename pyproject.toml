[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-lot-api"
version = "0.1.0"
description = "Parking Lot Management backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --reuse-db"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

