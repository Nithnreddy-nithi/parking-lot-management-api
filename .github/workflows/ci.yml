name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parking_lot_test
          POSTGRES_USER: parking_lot_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_lot_test -d parking_lot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: parking_lot_test
      POSTGRES_USER: parking_lot_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Check committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
      - name: Build production image
        run: docker build --target runtime -t parking-lot-api:ci .

